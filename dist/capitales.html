<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capitales du monde · Les Jeux des Explorateurs</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7C5CFC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Explorateurs">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --ink:#2B3A67; --ink-soft:#5B6B98; --violet:#7C5CFC; --leaf:#22c55e; --coral:#ff5a5f;
  --shadow:0 8px 24px rgba(43,58,103,.14);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,111,174,.18), transparent 38%),
    radial-gradient(circle at 88% 12%, rgba(124,92,252,.16), transparent 36%),
    radial-gradient(circle at 80% 90%, rgba(255,176,32,.20), transparent 40%),
    linear-gradient(160deg,#E6F6FF 0%,#FFF6E6 100%);
}
#app{height:100%;height:100dvh;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(10px,2vw,22px)}
.screen.active{display:flex}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ---------- Boutons ---------- */
.btn{background:var(--violet);color:#fff;border-radius:16px;padding:12px 22px;font-weight:800;font-size:17px;box-shadow:0 6px 0 #5b3fd6;transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #5b3fd6}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 6px 0 #d6def5}
.btn.alt:active{box-shadow:0 3px 0 #d6def5}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{background:#fff;border-radius:16px;padding:9px 14px;box-shadow:var(--shadow);font-weight:800;transition:transform .1s}
a.chip{display:inline-block}
.chip:hover{transform:translateY(-2px)}

/* ---------- Menus ---------- */
#players,#home,#geoh,#calc,#menu{align-items:center;text-align:center;overflow:auto}
.topbar{align-self:flex-start;display:flex;gap:8px}
.menu-in{width:min(900px,100%);margin:auto}
.logo{font-size:clamp(34px,6.5vw,64px);font-weight:900;letter-spacing:-.02em;margin:0;line-height:1.05}
.logo .g{background:linear-gradient(90deg,#7C5CFC,#FF6FAE 55%,#FFB020);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .globe{display:inline-block;animation:bob 3.2s ease-in-out infinite;margin-right:.1em}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
.tagline{font-size:clamp(16px,2.3vw,22px);color:var(--ink-soft);font-weight:700;margin:.5em 0 1.6em}
.menu-foot{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.how{margin-top:18px;color:var(--ink-soft);font-weight:600;font-size:15px}

.bigcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.bigcard{display:block;background:#fff;border-radius:32px;padding:26px 16px 22px;box-shadow:var(--shadow);border-bottom:9px solid var(--zc);transition:transform .15s}
.bigcard:hover{transform:translateY(-6px) rotate(-1deg)}
.bigcard:active{transform:scale(.97)}
.bigcard .emo{font-size:clamp(56px,9vw,84px);line-height:1.1}
.bigcard .zn{font-weight:900;font-size:clamp(22px,3vw,30px);margin-top:8px}
.bigcard .sub{font-size:15px;font-weight:700;color:var(--ink-soft);margin-top:6px}

.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.zone{background:#fff;border-radius:24px;padding:18px 10px 14px;box-shadow:var(--shadow);border-bottom:7px solid var(--zc);transition:transform .15s}
.zone:hover{transform:translateY(-5px) rotate(-1.2deg)}
.zone:active{transform:translateY(0) scale(.97)}
.zone .emo{font-size:46px;line-height:1.1}
.zone .zn{font-weight:900;font-size:19px;margin-top:6px}
.zone .rec{font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:5px}
@media(max-width:560px){.zone.world{grid-column:1/-1}}

.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;text-align:left}
.ops.single{grid-template-columns:minmax(250px,420px);justify-content:center}
.opcard{background:#fff;border-radius:26px;padding:16px;box-shadow:var(--shadow);border-bottom:8px solid var(--zc)}
.ophead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.opsign{width:58px;height:58px;border-radius:18px;background:var(--zc);display:grid;place-items:center;font-size:38px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.14);line-height:1}
.opname{font-weight:900;font-size:23px}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:16px;background:#F3F6FF;margin-top:8px;font-weight:900;transition:transform .12s,background .12s}
.lvl:hover{background:#E6ECFF;transform:translateX(3px)}
.lvl:active{transform:scale(.98)}
.lvl .le{font-size:26px}
.lvl .ln{line-height:1.15}
.lvl .ln small{display:block;color:var(--ink-soft);font-weight:700;font-size:13px}
.lvl .lr{font-size:13px;color:var(--ink-soft);font-weight:800}

/* ---------- Jeu (commun) ---------- */
#game{gap:10px}
#game[data-mode="geo"] #stage,#game[data-mode="geo"] #pad{display:none}
#game[data-mode="math"] #mapwrap{display:none}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.hud-left{display:flex;gap:8px}
.target{background:#fff;border-radius:22px;padding:8px 18px;text-align:center;box-shadow:var(--shadow);border:4px solid transparent;min-height:68px;display:flex;flex-direction:column;justify-content:center;transition:background .15s,border-color .15s}
.target small{font-size:12px;color:var(--ink-soft);font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.target b{font-size:clamp(22px,4.2vw,40px);line-height:1.1}
.target .trow{display:flex;align-items:center;justify-content:center;gap:10px}
.target #tIcon{font-size:clamp(24px,4.4vw,38px);line-height:1}
.target #tIcon[hidden]{display:none}
.target #tFlag{height:clamp(22px,4vw,36px);width:auto;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.target.ok{border-color:var(--leaf);background:#E8FBEF}
.target.ko{border-color:var(--coral);background:#FFEDED}
.stats{display:flex;gap:8px}
.pill{background:#fff;border-radius:16px;padding:8px 14px;box-shadow:var(--shadow);font-weight:900;font-size:clamp(17px,2.4vw,26px);display:flex;align-items:center;gap:6px;min-width:88px;justify-content:center}
.pill.danger{color:var(--coral);animation:throb .5s ease-in-out infinite alternate}
.pill.bump{animation:bump .35s ease-out}
@keyframes throb{to{transform:scale(1.08)}}
@keyframes bump{40%{transform:scale(1.2)}}
.bar{height:10px;background:rgba(255,255,255,.75);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(43,58,103,.15)}
.bar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#22c55e);transition:width .1s linear}
.bar.warn i{background:linear-gradient(90deg,#fbbf24,#fb923c)}
.bar.danger i{background:linear-gradient(90deg,#fb7185,#ef4444)}
.count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;background:rgba(255,255,255,.35);z-index:6}
.count.show{display:flex}
.count div{font-size:clamp(80px,18vw,200px);font-weight:900;color:#fff;text-shadow:0 6px 0 var(--violet),0 16px 34px rgba(43,58,103,.35);animation:zoomin .65s ease-out}
@keyframes zoomin{from{transform:scale(.3);opacity:0}60%{transform:scale(1.12);opacity:1}to{transform:scale(1)}}
.pop{position:absolute;pointer-events:none;font-weight:900;font-size:34px;color:#16a34a;text-shadow:0 2px 0 #fff,0 0 12px #fff;animation:floatup .9s ease-out forwards;z-index:3}
@keyframes floatup{from{transform:translate(-50%,-50%) scale(.6);opacity:1}to{transform:translate(-50%,-190%) scale(1.25);opacity:0}}
@media(max-width:640px){
  .hud{grid-template-columns:auto 1fr}
  .target{grid-column:1/-1;order:3;min-height:52px}
  .stats{justify-content:flex-end}
}

/* ---------- Jeu : carte ---------- */
.mapwrap{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;background:linear-gradient(#D9F1FF,#A9DDF7);box-shadow:inset 0 0 0 4px #fff,var(--shadow)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
.c{stroke:#fff;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
.E{fill:#B8A9F2}.A{fill:#FFD97D}.F{fill:#FFB48A}.M{fill:#93D8A0}.O{fill:#F7A8C8}
/*ORGANES*/.o-gros{fill:#E8AD76}.o-intestins{fill:#F9B3C4}.o-reins{fill:#A55AA0}.o-foie{fill:#BE7248}.o-estomac{fill:#F7AA5E}.o-rate{fill:#8F5AB8}.o-pancreas{fill:#F4D663}.o-vessie{fill:#FFE27A}.o-poumons{fill:#9ED9F2}.o-coeur{fill:#EE4A57}.o-cerveau{fill:#F7A6BF}.c.organ,html[data-theme="halloween"] .c.organ{stroke:#4B1E1E;stroke-width:3px}/*/ORGANES*/
.deco,.deco *{pointer-events:none}
.deco.dim{opacity:.1}
.c.bone,html[data-theme="halloween"] .c.bone{fill:#F8E1C3;stroke:#4B1E1E;stroke-width:3px}
.c:hover{filter:brightness(1.08) saturate(1.25)}
.c.ok{fill:#16c55a!important;stroke:#0b6b30;stroke-width:2.4px}
.c.ko{fill:#ff5a5f!important;stroke:#a30f16;stroke-width:2.4px}
.c.show{stroke:#0b6b30;stroke-width:3px;animation:pulse .5s steps(1,end) infinite alternate}
@keyframes pulse{from{fill:#16c55a}to{fill:#c6f9d8}}
.tools{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.tools button{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:22px;font-weight:900;line-height:1}
.tools button:hover{transform:translateY(-2px)}
.skip{position:absolute;left:12px;bottom:12px}

/* ---------- Jeu : calcul ---------- */
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.qcard{background:#fff;border-radius:34px;padding:clamp(16px,3vh,34px) clamp(14px,3vw,48px);box-shadow:var(--shadow);border:6px solid transparent;text-align:center;max-width:100%;transition:background .15s,border-color .15s}
.qcard.ok{border-color:var(--leaf);background:#E8FBEF}
.qcard.ko{border-color:var(--coral);background:#FFEDED}
.qcard.hide{visibility:hidden}
.eq{display:flex;align-items:center;justify-content:center;gap:.22em;font-weight:900;line-height:1.1;font-size:clamp(40px,min(11vw,15vh),130px)}
.eq .op{color:var(--ink-soft)}
.eq .num{color:var(--ink)}
.slot{min-width:1.5em;padding:0 .12em;border-bottom:.09em dashed #b9c4ec;color:var(--violet)}
.slot.empty{color:#c7cff0}
.qcard.ok .slot{color:#15a34a;border-bottom-color:#15a34a}
.qcard.ko .slot{color:var(--coral);border-bottom-color:var(--coral);text-decoration:line-through;text-decoration-thickness:.07em}
.hint{min-height:1.4em;margin-top:6px;font-weight:900;font-size:clamp(18px,3vh,28px);color:#15a34a}
.frames{--d:clamp(12px,2.6vh,22px);display:none;gap:clamp(18px,4vw,44px);justify-content:center;margin-top:10px;align-items:center}
.frames.on{display:flex}
.frame{display:grid;gap:calc(var(--d)/3.2)}
.dot{width:var(--d);height:var(--d);border-radius:50%}
.dot.a{background:#7C5CFC}.dot.b{background:#FF8A3D}.dot.x{background:#E3E8FF;box-shadow:inset 0 0 0 2px #c7cff0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(440px,100%);margin:0 auto}
.pad button{height:clamp(48px,9vh,78px);font-size:clamp(24px,4vh,34px);font-weight:900;background:#fff;border-radius:18px;box-shadow:0 5px 0 #d6def5;transition:transform .06s,box-shadow .06s;user-select:none;-webkit-user-select:none}
.pad button:hover{filter:brightness(.98)}
.pad button:active{transform:translateY(3px);box-shadow:0 2px 0 #d6def5}
.pad .del{background:#FFE3E3;box-shadow:0 5px 0 #f4bcbc}
.pad .del:active{box-shadow:0 2px 0 #f4bcbc}
.pad .go{background:#D9F9E4;box-shadow:0 5px 0 #a9e6bf;color:#15803d}
.pad .go:active{box-shadow:0 2px 0 #a9e6bf}

/* ---------- Fin de partie & classement ---------- */
#end{overflow:auto}
.endwrap{width:min(980px,100%);display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:auto}
.endwrap.boardonly{grid-template-columns:1fr;max-width:560px}
.endwrap.boardonly .resultcard{display:none}
.endwrap:not(.boardonly) #btnBack{display:none}
@media(max-width:780px){.endwrap{grid-template-columns:1fr}}
.card{background:#fff;border-radius:28px;padding:22px;box-shadow:var(--shadow)}
.resultcard{text-align:center}
.resultcard h2,.boardcard h2{margin:0;font-size:clamp(22px,3.4vw,30px)}
.big{font-size:clamp(70px,13vw,120px);font-weight:900;line-height:1.05;background:linear-gradient(90deg,#7C5CFC,#FF6FAE);-webkit-background-clip:text;background-clip:text;color:transparent}
.unit{font-weight:800;color:var(--ink-soft);margin-top:-6px}
.errs{font-weight:700;color:var(--ink-soft);margin-top:4px;font-size:15px}
.msg{font-weight:800;font-size:19px;margin:12px 0 4px}
.badge[hidden]{display:none}
.badge{display:inline-block;background:#FFF1C7;color:#9a6200;border-radius:99px;padding:6px 14px;font-weight:900;margin:4px 0}
.namefield{display:flex;gap:8px;margin-top:14px}
.namefield input{flex:1;min-width:0;font:inherit;font-weight:800;padding:12px 14px;border-radius:14px;border:3px solid #dbe4ff;color:var(--ink);outline:none}
.namefield input:focus{border-color:var(--violet)}
.savedmsg{min-height:22px;margin-top:8px;font-weight:700;color:var(--ink-soft)}
.actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tabs[hidden]{display:none}
.tabs.sub{margin:8px 0 12px}
.tab{padding:6px 12px;border-radius:99px;background:#EEF2FF;font-weight:800;font-size:14px}
.tabs.sub .tab{background:#F6F8FF}
.tab.on{background:var(--violet);color:#fff}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:grid;grid-template-columns:40px 1fr auto;align-items:center;padding:9px 12px;border-radius:14px;background:#F6F8FF;font-weight:800}
.board li.me{background:#FFF1C7;outline:3px solid #FFC83D}
.board .rk{font-size:20px}
.board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-weight:900;color:var(--violet)}
.empty{color:var(--ink-soft);text-align:center;padding:18px 0;font-weight:700}
.linkbtn{display:block;margin:14px auto 0;color:var(--ink-soft);font-size:13px;font-weight:700;text-decoration:underline}
.newplayer{max-width:520px;margin:20px auto 0}
.who{cursor:default}
button.who{cursor:pointer}

/* ---------- Podium ---------- */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:6px 0 14px;min-height:150px}
.podium[hidden]{display:none}
.pod{flex:1;max-width:130px;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.pod .pm{font-size:30px;line-height:1}
.pod .pn{font-weight:900;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.pod .ps{font-weight:900;color:var(--violet);font-size:15px;margin-bottom:4px}
.pod .pb{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;font-weight:900;font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.pod.p1 .pb{height:96px;background:#FFC83D}
.pod.p2 .pb{height:68px;background:#B5BFD6}
.pod.p3 .pb{height:50px;background:#E0905A}
.linkbtn[hidden]{display:none}

/* ---------- Thème Halloween : manoir hanté (html[data-theme="halloween"]) ---------- */
#decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;display:none}
html[data-theme="halloween"] #decor{display:block}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;user-select:none;line-height:1;filter:drop-shadow(0 0 18px rgba(190,225,255,.85))}
.moon{position:absolute;top:5vh;right:7vw;width:clamp(60px,9vw,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 34%,#FFF8D6,#F2D98A 70%);box-shadow:0 0 60px 20px rgba(255,226,140,.35)}
.manor{position:absolute;right:1vw;bottom:0;width:clamp(230px,36vw,520px);height:auto;max-height:55vh}
.win{animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:1}40%{opacity:.5}42%{opacity:1}70%{opacity:.8}72%{opacity:1}}
.bat{position:absolute;top:12vh;left:0;font-size:28px;animation:batfly 17s linear infinite}
.bat.b2{top:24vh;font-size:22px;animation-duration:23s;animation-delay:-9s}
@keyframes batfly{0%{transform:translate(-10vw,0)}25%{transform:translate(30vw,-3vh)}50%{transform:translate(55vw,4vh)}75%{transform:translate(85vw,-2vh)}100%{transform:translate(110vw,2vh)}}
.pk{position:absolute;bottom:.5vh;font-size:clamp(54px,9vw,120px);line-height:1;text-shadow:0 0 24px #ff9a1f}
.pk1{left:2vw}.pk2{left:calc(2vw + clamp(60px,10vw,130px));font-size:clamp(36px,6vw,80px)}
.pk .glow{position:absolute;left:50%;top:55%;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,150,30,.5),transparent 62%);animation:candle 2.6s infinite}
.pk2 .glow{animation-delay:-1.1s}
@keyframes candle{0%,100%{opacity:.9}20%{opacity:.55}35%{opacity:1}55%{opacity:.65}75%{opacity:.95}}
@media(prefers-reduced-motion:reduce){#decor *{animation:none!important}}
html[data-theme="halloween"]{--ink:#F6E9FF;--ink-soft:#C9A9E6;--violet:#FF8A1F;--leaf:#4ade80;--coral:#ff6b6b;--shadow:0 8px 24px rgba(0,0,0,.5)}
html[data-theme="halloween"] body{background:radial-gradient(circle at 15% 90%,rgba(255,120,20,.16),transparent 42%),linear-gradient(180deg,#0d0820 0%,#241239 58%,#3a1a2c 100%)}
html[data-theme="halloween"] .btn{box-shadow:0 6px 0 #a34e00}
html[data-theme="halloween"] .btn:active{box-shadow:0 3px 0 #a34e00}
html[data-theme="halloween"] .btn.alt,html[data-theme="halloween"] .chip,html[data-theme="halloween"] .bigcard,html[data-theme="halloween"] .zone,html[data-theme="halloween"] .opcard,
html[data-theme="halloween"] .target,html[data-theme="halloween"] .pill,html[data-theme="halloween"] .tools button,html[data-theme="halloween"] .qcard,html[data-theme="halloween"] .card,
html[data-theme="halloween"] .pad button,html[data-theme="halloween"] .namefield input{background:#2a1840;color:var(--ink)}
html[data-theme="halloween"] .btn.alt{box-shadow:0 6px 0 #120a1f}
html[data-theme="halloween"] .btn.alt:active{box-shadow:0 3px 0 #120a1f}
html[data-theme="halloween"] .pad button{box-shadow:0 5px 0 #120a1f}
html[data-theme="halloween"] .pad button:active{box-shadow:0 2px 0 #120a1f}
html[data-theme="halloween"] .pad .del{background:#4a1d2c;box-shadow:0 5px 0 #1f0a12}
html[data-theme="halloween"] .pad .go{background:#17432c;box-shadow:0 5px 0 #0a1f14;color:#7ee7a8}
html[data-theme="halloween"] .lvl,html[data-theme="halloween"] .tab,html[data-theme="halloween"] .board li{background:#3a2356}
html[data-theme="halloween"] .lvl:hover{background:#4a2d6c}
html[data-theme="halloween"] .tabs.sub .tab{background:#33204d}
html[data-theme="halloween"] .tab.on{background:var(--violet);color:#1b0d2a}
html[data-theme="halloween"] .board li.me{background:#5a3a12;outline-color:#FFB020}
html[data-theme="halloween"] .target.ok,html[data-theme="halloween"] .qcard.ok{background:#12331f}
html[data-theme="halloween"] .target.ko,html[data-theme="halloween"] .qcard.ko{background:#3d1620}
html[data-theme="halloween"] .badge{background:#5a3a12;color:#ffd27a}

/* Décor Halloween : toiles, araignées, yeux, tombes, brouillard, éclair */

@keyframes dangle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.gleyes{position:absolute;width:44px;height:14px;opacity:0;animation:eyeblink 9s infinite}
.gleyes::before,.gleyes::after{content:"";position:absolute;top:0;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle,#fff6a8 20%,#ffb020 70%);box-shadow:0 0 10px 3px rgba(255,170,30,.55)}
.gleyes::before{left:0}.gleyes::after{right:0}
.gleyes.e1{left:5vw;top:42vh}.gleyes.e2{right:9vw;top:64vh;animation-delay:-3s}.gleyes.e3{left:47vw;top:30vh;animation-delay:-6s}

const byCode = {};

const MAPBOX = DATA.box ? {x0:DATA.box[0], y0:DATA.box[1], x1:DATA.box[2], y1:DATA.box[3]} : {x0:0, y0:0, x1:1000, y1:520};
let zoneView = {x:0,y:0,w:1000,h:520}, view = {x:0,y:0,w:1000,h:520};   // remplacés dès le début d'une partie par le cadrage de la zone
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function fitView(zone){
  const [x0,y0,x1,y1] = DATA.zones[zone];
  const r = mapwrap.getBoundingClientRect();
  const ar = (r.width / r.height) || 1.6;
  let w = (x1 - x0) * 1.06, h = (y1 - y0) * 1.06;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  if(w / h < ar) w = h * ar; else h = w / ar;
  return {x:cx - w/2, y:cy - h/2, w, h};
}
function applyView(){ svg.setAttribute('viewBox', view.x + ' ' + view.y + ' ' + view.w + ' ' + view.h); }
function clampPan(){
  view.x = clamp(view.x, MAPBOX.x0 - view.w * .25, MAPBOX.x1 - view.w * .75);
  view.y = clamp(view.y, MAPBOX.y0 - view.h * .25, MAPBOX.y1 - view.h * .75);
}
function zoomAt(factor, cx, cy){
  const r = svg.getBoundingClientRect();
  const fx = (cx - r.left) / r.width, fy = (cy - r.top) / r.height;
  const nw = clamp(view.w * factor, zoneView.w / 12, zoneView.w);
  const nh = nw * view.h / view.w;
  view = {x: view.x + (view.w - nw) * fx, y: view.y + (view.h - nh) * fy, w:nw, h:nh};
  clampPan(); applyView();
}
function zoomCenter(f){ const r = svg.getBoundingClientRect(); zoomAt(f, r.left + r.width/2, r.top + r.height/2); }
svg.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(Math.exp(clamp(e.deltaY, -100, 100) * 0.002), e.clientX, e.clientY);
}, {passive:false});
$('zIn').addEventListener('click', () => zoomCenter(0.7));

let drag = null, dragMoved = false;
svg.addEventListener('pointerdown', e => {

/* ---------- Mode exploration : pas de chrono, une fiche au survol (ou au toucher) ---------- */
const CONT = {E:'Europe', A:'Asie', F:'Afrique', M:'Amériques', O:'Océanie'};
const FRANCE_KM2 = 551695;
const nf = n => n.toLocaleString('fr-FR');
const up = s => s.charAt(0).toUpperCase() + s.slice(1);
function popText(n){
  if(n >= 1e6){
    const big = n >= 1e9, v = n / (big ? 1e9 : 1e6), t = v >= 10 ? String(Math.round(v)) : v.toFixed(1).replace('.', ',').replace(',0', '');
    return 'environ ' + t + (big ? (v < 2 ? ' milliard' : ' milliards') : (v < 2 ? ' million' : ' millions')) + ' de personnes';
  }
  return 'environ ' + nf(n >= 10000 ? Math.round(n / 1000) * 1000 : n >= 1000 ? Math.round(n / 100) * 100 : n) + ' personnes';
}
function areaText(a, withFrance){
  let s = nf(a < 10 ? a : Math.round(a)).replace('.', ',') + ' km²';
  if(withFrance){
    const r = a / FRANCE_KM2;
    if(r >= 1.5) s += ' (environ ' + (r >= 10 ? nf(Math.round(r)) : r.toFixed(1).replace('.', ',').replace(',0', '')) + ' fois la France)';
    else if(r > 0.67) s += ' (à peu près comme la France)';
    else if(r < 0.002) s += ' (minuscule !)';
    else s += ' (environ ' + nf(Math.round(1 / r)) + ' fois plus petit que la France)';
  }
  return s;
}

/* ===== Jeu de géographie ===== */
function eligible(level, scale){
  const all = Object.entries(DATA.countries).filter(([k, v]) => v.t && level.reg.includes(v.r));
  let thr = S.game.minpx || MIN_PX2, pool = [];
  while(thr >= 0){
    pool = all.filter(([, v]) => v.a * scale * scale >= thr).map(([k]) => k);
    if(pool.length >= 12 || thr === 0) break;
    thr = Math.max(0, thr - 10);
  }
  return pool;
}
function mark(code, cls){
  const ps = byCode[code] || [];
  ps.forEach(p => { p.classList.add(cls); if(!S.game.keepOrder) p.parentNode.appendChild(p); });   // organes : on garde l'ordre de superposition du dessin
  const dec = ps.length && ps[ps.length - 1].nextElementSibling;           // organes : les détails dessinés par-dessus s'estompent pour que le vert se voie bien
  if(S.game.keepOrder && dec && dec.classList.contains('deco')) dec.classList.add('dim');
}
function unmark(){ clearTimeout(S.hintT); hidePin();  svg.querySelectorAll('.ok,.ko,.show,.gray,.hl').forEach(p => p.classList.remove('ok','ko','show','gray','hl')); svg.querySelectorAll('.deco.dim').forEach(g => g.classList.remove('dim')); }
// Indice des départements : sans clic au bout de 4 s, les zones où le département n'est pas passent en gris
// Pays (mode aidé) : au bout de 4 s, les 2/3 des autres pays de la zone, les plus éloignés du pays demandé, passent en gris
const centers = {};
function centerOf(code){                             // centre du plus grand morceau du pays (la France compte aussi ses îles lointaines : on les ignore)
  if(centers[code]) return centers[code];
  let best = null, area = -1;
  (byCode[code] || []).forEach(p => {
    (p.getAttribute('d').match(/M[^M]+/g) || []).forEach(sub => {          // un sous-tracé par morceau du pays
      const n = sub.match(/-?\d+\.?\d*/g).map(Number); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for(let i = 0; i + 1 < n.length; i += 2){ x0 = Math.min(x0, n[i]); x1 = Math.max(x1, n[i]); y0 = Math.min(y0, n[i + 1]); y1 = Math.max(y1, n[i + 1]); }
      const a = (x1 - x0) * (y1 - y0);
      if(a > area){ area = a; best = [(x0 + x1) / 2, (y0 + y1) / 2] }
    });
  });
  return centers[code] = best || [0, 0];
}
function grayFar(){
  const t = centerOf(S.cur), dist = k => { const c = centerOf(k); return Math.hypot(c[0] - t[0], c[1] - t[1]); };
  const others = Object.keys(DATA.countries).filter(k => k !== S.cur && byCode[k] && S.level.reg.includes(DATA.countries[k].r));
  others.sort((a, b) => dist(a) - dist(b));
  others.slice(Math.ceil(others.length / 3)).forEach(k => byCode[k].forEach(p => p.classList.add('gray')));
}
function grayOut(){
  if(S.locked || !S.running) return;
  if(S.game.id === 'geo') grayFar();
  else {
    const zone = DATA.countries[S.cur].r;
    svg.querySelectorAll('path[data-c]').forEach(p => { if(DATA.countries[p.dataset.c].r !== zone) p.classList.add('gray'); });
  }
  $('tLabel').textContent = S.game.ask + ' · 💡 indice';
}
function nextTarget(){
  unmark(); hideTip();
  if(!S.queue.length){                              // nouveau tour : on évite de redemander l'organe qui vient de passer
    S.queue = shuffle(S.pool);
    if(S.queue.length > 1 && S.queue[S.queue.length - 1] === S.cur) S.queue.unshift(S.queue.pop());
  }
  S.cur = S.queue.pop();

/* ---------- Mode aidé : nom + drapeau (pays) ou photo (départements) au survol ---------- */
let tipCode = '';
function hideTip(){ tipCode = ''; $('tip').hidden = true; }
function showTip(code, e){
  const c = DATA.countries[code], tip = $('tip'); if(!c){ hideTip(); return; }
  if(code !== tipCode){
    tipCode = code;
    const m = MEDIA[code], img = $('tipImg'), src = m ? (m.i || m) : '';

  }
  const r = mapwrap.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;

function tipAt(e){
  if(!S.assist || !S.running || (drag && dragMoved)){ hideTip(); return; }
  const p = e.target.closest ? e.target.closest('path[data-c]') : null;
  if(p) showTip(p.dataset.c, e); else hideTip();
}
svg.addEventListener('pointermove', tipAt);
svg.addEventListener('pointerdown', tipAt);          // sur tablette : le doigt posé fait apparaître l'aide
svg.addEventListener('pointerleave', hideTip);

/* ===== Quiz des capitales : un pays (drapeau + carte), 4 capitales au choix ===== */
let capPin = null;
function hidePin(){ if(capPin) capPin.setAttribute('visibility', 'hidden'); }
function showPin(code){                              // repère sur le pays, même quand il est minuscule
  if(!capPin){
    const NS = 'http://www.w3.org/2000/svg'; capPin = document.createElementNS(NS, 'g');
    ['pinring', 'pindot'].forEach(c => { const e = document.createElementNS(NS, 'circle'); e.setAttribute('class', c); capPin.appendChild(e); });
    svg.appendChild(capPin);
  }
  const [x, y] = centerOf(code), k = view.w / 110;
  [[capPin.firstChild, 3.4 * k], [capPin.lastChild, k]].forEach(([c, r]) => { c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r); });
  capPin.removeAttribute('visibility'); svg.appendChild(capPin);
}
function capPool(L){ return Object.keys(CAPS).filter(k => DATA.countries[k] && (L.codes ? L.codes.includes(k) : L.reg.includes(DATA.countries[k].r))); }
function capChoices(code, L){                        // la bonne capitale + 3 autres : de la même région (Europe, continent) ou parmi les pays connus
  const right = CAPS[code], r = DATA.countries[code].r;
  const pool = L.codes ? L.codes : L.reg.length === 1 ? capPool(L) : Object.keys(CAPS).filter(k => DATA.countries[k] && DATA.countries[k].r === r);
  const ok = k => k !== code && CAPS[k] && CAPS[k] !== right;
  const picks = shuffle(pool.filter(ok)).slice(0, 3);
  if(picks.length < 3) shuffle(Object.keys(CAPS).filter(k => ok(k) && !picks.includes(k))).slice(0, 3 - picks.length).forEach(k => picks.push(k));
  return shuffle([right].concat(picks.map(k => CAPS[k])));
}
function nextCapital(){
  unmark();
  if(!S.queue.length){
    S.queue = shuffle(S.pool);
    if(S.queue.length > 1 && S.queue[S.queue.length - 1] === S.cur) S.queue.unshift(S.queue.pop());
  }
  S.cur = S.queue.pop();
  const c = DATA.countries[S.cur], m = MEDIA[S.cur], fl = $('qFlag');
  setTarget('Quelle est la capitale de', c.n);
  fl.hidden = !m; if(m) fl.src = m.i || m;
  S.zoneKey = S.level.reg && S.level.reg.length === 1 ? S.level.zone : ({E:'europe', A:'asie', F:'afrique', M:'ameriques'}[c.r] || 'monde');   // la carte se cadre sur le continent du pays
  zoneView = fitView(S.zoneKey); view = {...zoneView}; applyView();
  mark(S.cur, 'hl'); showPin(S.cur);
  const box = $('qChoices'); box.textContent = '';
  capChoices(S.cur, S.level).forEach(name => {
    const b = el('button', 'choice' + (name.length > 14 ? ' long' : ''), name); b.dataset.n = name;
    b.addEventListener('click', () => pickCap(b)); box.appendChild(b);
  });
  S.locked = false;
}
function popAtEl(elm, text){
  const box = $('qcm'), r = box.getBoundingClientRect(), b = elm.getBoundingClientRect(), p = el('div', 'pop', text);
  p.style.left = (b.left + b.width / 2 - r.left) + 'px'; p.style.top = (b.top - r.top) + 'px';
  box.appendChild(p); setTimeout(() => p.remove(), 950);
}
function pickCap(b){
  if(!S.running || S.locked || !S.game || S.game.mode !== 'qcm') return;
  S.locked = true;
  const right = CAPS[S.cur];
  if(b.dataset.n === right){
    S.score++; setScore(); bumpScore(); b.classList.add('ok'); sfx.ok(); popAtEl(b, '+1');
    setTarget('Bravo !', right, 'ok'); later(nextCapital, 650);
  } else {
    S.wrong++; b.classList.add('ko');
    [...$('qChoices').children].forEach(x => { if(x.dataset.n === right) x.classList.add('ok'); });
    sfx.ko(); setTarget('Presque ! C’est', right, 'ko'); later(nextCapital, 1700);
  }
}

/* ===== Jeux de calcul ===== */
function qAdd(L){ const s = rnd(L.min, L.max), a = rnd(1, s - 1), b = s - a; return {a, b, r:s, key:[a, b].sort((x, y) => x - y).join('+')}; }
function qSub(L){ const a = rnd(L.min, L.max), b = rnd(1, a - 1); return {a, b, r:a - b, key:a + '-' + b}; }
function qMul(L){
  const t = L.tables[rnd(0, L.tables.length - 1)], m = rnd(L.bmin, L.bmax), swap = Math.random() < .5;
  return {a: swap ? m : t, b: swap ? t : m, r:t * m, key:[t, m].sort((x, y) => x - y).join('x')};
}
function makeQ(){
  const id = S.game.id, L = S.level; let q, tries = 0;
  do{ q = id === 'add' ? qAdd(L) : id === 'sub' ? qSub(L) : qMul(L); tries++; }
  while(S.recent.includes(q.key) && tries < 40);
  S.recent.push(q.key); if(S.recent.length > 8) S.recent.shift();
  return q;
}
function frame(n, clsOf){
  const fr = el('div', 'frame');
  fr.style.gridTemplateColumns = 'repeat(' + Math.min(n, 5) + ', var(--d))';
  for(let i = 0; i < n; i++) fr.appendChild(el('span', 'dot ' + clsOf(i)));
  return fr;
}
function renderFrames(){
  const f = $('frames'); f.textContent = '';
  if(!S.level.dots){ f.classList.remove('on'); return; }
  f.classList.add('on');
  const q = S.q;
  if(S.game.id === 'add'){ f.append(frame(q.a, () => 'a'), frame(q.b, () => 'b')); }
  else if(S.game.id === 'sub'){ f.append(frame(q.a, i => i < q.r ? 'a' : 'x')); }   // les points barrés = ceux qu'on enlève
}
function renderAns(){
  const a = $('ans');
  a.textContent = S.typed || '?';
  a.classList.toggle('empty', !S.typed);
}
function nextQuestion(){
  S.q = makeQ(); S.typed = '';
  $('qa').textContent = S.q.a; $('qb').textContent = S.q.b;
  $('hint').textContent = '';
  $('qcard').className = 'qcard';
  renderAns(); renderFrames();
  setTarget('Calcule !', S.game.emoji + ' ' + S.level.n);
  S.locked = false;
}
function popAtAnswer(text){
  const stage = $('stage'), sr = stage.getBoundingClientRect(), ar = $('ans').getBoundingClientRect();
  const p = el('div', 'pop', text); p.style.fontSize = '44px';
  p.style.left = (ar.left + ar.width / 2 - sr.left) + 'px'; p.style.top = (ar.top + ar.height / 2 - sr.top) + 'px';
  stage.appendChild(p); setTimeout(() => p.remove(), 950);
}
const isMath = () => S.game && S.game.mode === 'math';
function press(d){
  if(!S.running || S.locked || !isMath()) return;
  if(S.typed.length >= String(S.q.r).length) return;
  S.typed += d; sfx.key(); renderAns();
  if(S.typed.length === String(S.q.r).length) check();   // validation automatique
}
function back(){
  if(!S.running || S.locked || !isMath() || !S.typed) return;
  S.typed = S.typed.slice(0, -1); renderAns();
}
function validate(){
  if(!S.running || S.locked || !isMath() || !S.typed) return;
  check();
}
function check(){
  S.locked = true;
  const ok = parseInt(S.typed, 10) === S.q.r;
  const eq = S.q.a + ' ' + S.game.sign + ' ' + S.q.b + ' = ' + S.q.r;
  if(ok){
    S.score++; setScore(); bumpScore();
    $('qcard').className = 'qcard ok';
    sfx.ok(); popAtAnswer('+1');
    setTarget('Bravo !', eq, 'ok');
    later(nextQuestion, 450);
  } else {
    S.wrong++;
    $('qcard').className = 'qcard ko';
    $('hint').textContent = 'La réponse est ' + S.q.r;
    sfx.ko();
    setTarget('Presque !', eq, 'ko');
    later(nextQuestion, 1500);
  }
}

(function buildPad(){
  const pad = $('pad');
  ['1','2','3','4','5','6','7','8','9','del','0','go'].forEach(k => {
    const b = el('button');
    b.dataset.k = k;
    if(k === 'del'){ b.className = 'del'; b.textContent = '⌫'; b.setAttribute('aria-label', 'Effacer'); }
    else if(k === 'go'){ b.className = 'go'; b.textContent = '✓'; b.setAttribute('aria-label', 'Valider'); }
    else b.textContent = k;
    pad.appendChild(b);
  });
  pad.addEventListener('pointerdown', e => {
    const b = e.target.closest('button'); if(!b) return;
    e.preventDefault();
    const k = b.dataset.k;
    if(k === 'del') back(); else if(k === 'go') validate(); else press(k);
  });
})();
document.addEventListener('keydown', e => {
  if(!$('game').classList.contains('active') || !isMath()) return;
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); press(e.key); }
  else if(e.key === 'Backspace'){ e.preventDefault(); back(); }
  else if(e.key === 'Enter'){ e.preventDefault(); validate(); }
});

/* ---------- Quitter / fin de partie ---------- */
$('btnQuit').addEventListener('click', () => {
  S.runId++; clearInterval(S.timerId); S.running = false; hideTip();
  S.explore = false; $('game').classList.remove('explore');
  $('count').classList.remove('show'); unmark();
  toMenu();
});
function endGame(){
  clearInterval(S.timerId); S.running = false; S.locked = true; $('btnSkip').disabled = true;
  unmark(); hideTip(); sfx.end();
  setTarget('⏰ Temps écoulé !', fmt(S.score) + ' ' + (S.score > 1 ? S.game.many : S.game.one));
  later(showEnd, 1000);
}
function msgFor(n){
  if(n === 0) return 'Pas de panique, on s’entraîne !';
  if(n < 5)  return 'C’est un bon début, continue !';
  if(n < 10) return 'Pas mal du tout !';
  if(n < 20) return 'Super ! Tu es rapide !';
  return 'Incroyable ! Champion ! 🏆';
}
function showEnd(){
  const G = S.game, L = S.level, prev = bestOf(G.id, L.k);
  $('endwrap').classList.remove('boardonly');
  $('endTitle').textContent = '⏰ Temps écoulé !';
  $('endScore').textContent = fmt(S.score);
  $('endUnit').textContent = (S.score > 1 ? G.many : G.one) + ' · ' + (G.mode !== 'math' ? L.e + ' ' + L.n : G.emoji + ' ' + L.n);
  $('endErr').textContent = (S.wrong === 0 ? 'Aucune erreur 👏' : (S.wrong === 1 ? '1 erreur' : S.wrong + ' erreurs')) + (S.assist ? ' · 🤝 Mode aidé : points ÷ 2' : '');
  $('btnMenu').textContent = G.exit ? '← Anatomie' : '📋 Menu';
  $('endMsg').textContent = msgFor(S.score);
  const record = S.score > 0 && S.score > prev;
  $('endRecord').hidden = !record;
  if(record) fxTimer = setTimeout(() => recordFx(S.score > 1 ? G.many : G.one), 450);   // feu d'artifice + « Nouveau Record ! »
  $('savedMsg').textContent = S.score <= 0 ? 'Trouve au moins 1 point pour entrer au classement.' : '';
  S.saved = false; S.entry = null;
  saveScore();
  if(S.score <= 0) renderBoard(G.id, L.k, null);
  show('end');
}
function saveScore(){
  if(S.saved || S.score <= 0) return;
  const name = player || 'Joueur';
  const all = scores(), k = bkey(S.game.id, S.level.k), list = all[k] || [];
  const entry = {n:name, s:S.score, d:Date.now()};
  if(S.assist) entry.a = 1;
  list.push(entry);
  list.sort((a, b) => b.s - a.s || a.d - b.d);
  all[k] = list.slice(0, 30);
  store.set(KEY, all);
  S.saved = true; S.entry = entry;
  const rank = all[k].findIndex(e => e.d === entry.d);
  $('savedMsg').textContent = rank >= 0 ? '✅ Bien joué ' + name + ' ! Tu es n°' + (rank + 1) + ' au classement.' : '✅ Enregistré ! (hors du top 10 cette fois)';
  renderBoard(S.game.id, S.level.k, entry);
}
$('btnAgain').addEventListener('click', () => { audio(); startGame(S.game.id, S.level.k); });
$('btnMenu').addEventListener('click', toMenu);
$('btnHome').addEventListener('click', home);
$('btnBack').addEventListener('click', () => go(S.from));

/* ---------- Classements ---------- */
const BOARD_SHOWN = 15;                            // lignes affichées ; on en garde 30 par niveau pour les totaux
const AGG = {                                      // classements « tous les jeux d'une famille »
  calc:   {id:'calc',   emoji:'🧮', short:'Tous les calculs',     games:['add','sub','mul']},
  geoall: {id:'geoall', emoji:'🌍', short:'Toute la géographie', games:['geo','fra','cap','eau']},
  anaall: {id:'anaall', emoji:'🦴', short:'Toute l’anatomie',    games:['org','cm2','os5','ske']}
};
let bGame = 'geo', bLevel = 'total';
// Classement d'un niveau : les meilleurs scores enregistrés. Classement « total » : pour chaque joueur,
// la somme de son meilleur score de chaque niveau (d'un jeu, ou de tous les calculs).
function boardRows(gid, lk){
  const all = scores();
  if(!AGG[gid] && lk !== 'total'){                // un même joueur peut revenir à des rangs différents, mais pas deux fois avec le même score
    const seen = new Set();
    return (all[bkey(gid, lk)] || []).filter(e => { const k = e.n + '\n' + e.s; if(seen.has(k)) return false; seen.add(k); return true; });
  }
  const best = {};
  (AGG[gid] ? AGG[gid].games : [gid]).forEach(g => GAMES[g].levels.forEach(l => {
    const mine = {};
    (all[bkey(g, l.k)] || []).forEach(e => { mine[e.n] = Math.max(mine[e.n] || 0, e.s); });
    Object.keys(mine).forEach(n => { best[n] = (best[n] || 0) + mine[n]; });
  }));
  return Object.keys(best).map(n => ({n, s:best[n]})).sort((x, y) => y.s - x.s || x.n.localeCompare(y.n));
}
// Podium : trois joueurs différents (leur meilleur score) ; s'il y en a moins de trois, on complète avec les scores suivants
function podiumRows(rows){
  const top = [], names = new Set();
  rows.forEach(r => { if(top.length < 3 && !names.has(r.n)){ top.push(r); names.add(r.n); } });
  rows.forEach(r => { if(top.length < 3 && !top.includes(r)) top.push(r); });
  return top.sort((a, b) => b.s - a.s);
}
function renderPodium(all){
  const rows = podiumRows(all), pd = $('podium'); pd.textContent = ''; pd.hidden = !rows.length;
  const medals = ['🥇','🥈','🥉'];
  [1, 0, 2].filter(i => rows[i]).forEach(i => {                // ordre d'affichage : 2e, 1er, 3e
    const col = el('div', 'pod p' + (i + 1));
    col.append(el('div', 'pm', medals[i]), el('div', 'pn', rows[i].n + (rows[i].a ? ' 🤝' : '')), el('div', 'ps', fmt(rows[i].s)), el('div', 'pb', String(i + 1)));
    pd.appendChild(col);
  });
}
function renderBoard(gid, lk, hl){
  bGame = gid; bLevel = lk;
  const G = AGG[gid] || GAMES[gid], total = !!AGG[gid] || lk === 'total';
  // Onglets du haut : accueil = Géographie / Calcul ; page Calcul = Tous / Additions / Soustractions / Multiplications
  const family = a => [[a.id, a.emoji + ' ' + a.short]].concat(a.games.map(g => [g, GAMES[g].emoji + ' ' + GAMES[g].short]));
  const tops = PAGE === 'home' ? [['geoall', '🌍 Géographie'], ['calc', '🧮 Calcul'], ['anaall', '🦴 Anatomie']]
    : PAGE === 'calc' ? family(AGG.calc) : PAGE === 'geoh' ? family(AGG.geoall) : PAGE === 'anah' ? family(AGG.anaall) : [];
  const gt = $('gtabs'); gt.textContent = '';
  tops.forEach(([g, label]) => {
    const b = el('button', 'tab' + (g === gid ? ' on' : ''), label);
    b.addEventListener('click', () => renderBoard(g, 'total', null));
    gt.appendChild(b);
  });
  gt.hidden = !tops.length;
  // Onglets de niveau : seulement sur la page d'un jeu (Total + un onglet par niveau)
  const tabs = $('tabs'); tabs.textContent = '';
  if(GAMES[PAGE] && G.levels.length > 1) [{k:'total', e:'🏅', n:'Total'}].concat(G.levels).forEach(l => {
    const b = el('button', 'tab' + (l.k === lk ? ' on' : ''), l.e + ' ' + l.n);
    b.addEventListener('click', () => renderBoard(gid, l.k, S.entry));
    tabs.appendChild(b);
  });
  tabs.hidden = !tabs.children.length;
  $('btnClear').hidden = total;                       // on n'efface qu'un niveau, jamais un total
  const rows = boardRows(gid, lk), ol = $('board'); ol.textContent = '';
  renderPodium(rows);
  if(!rows.length){
    const li = el('li', 'empty', 'Aucun score pour l’instant. Sois le premier !'); li.style.display = 'block';
    ol.appendChild(li); return;
  }
  const medals = ['🥇','🥈','🥉'], unit = total ? ['point', 'points'] : [G.b1, G.bn];
  rows.slice(0, BOARD_SHOWN).forEach((e, i) => {
    const me = total ? e.n === player : hl && e.d === hl.d;
    const li = el('li', me ? 'me' : '');
    li.append(el('span', 'rk', medals[i] || (i + 1) + '.'), el('span', 'nm', e.n + (e.a ? ' 🤝' : '')), el('span', 'sc', fmt(e.s) + ' ' + (e.s > 1 ? unit[1] : unit[0])));
    ol.appendChild(li);
  });
}
function showBoardOnly(from, gid){
  S.entry = null; S.from = from;
  $('endwrap').classList.add('boardonly');
  renderBoard(gid, 'total', null);
  show('end');
}
$('btnBoardHome').addEventListener('click', () => showBoardOnly(PAGE, PAGE === 'calc' ? 'calc' : PAGE === 'anah' ? 'anaall' : 'geoall'));
$('btnBoardGame').addEventListener('click', () => showBoardOnly('menu', PAGE));
$('btnClear').addEventListener('click', () => {
  if(!confirm('Effacer tous les scores de ce niveau ?')) return;
  const all = scores(); delete all[bkey(bGame, bLevel)]; store.set(KEY, all);
  renderBoard(bGame, bLevel, null);
});

window.__jxStop = () => { stopFx(); clearTimeout(ghostTimer); clearTimeout(lightTimer); clearTimeout(musicTimer); clearInterval(S.timerId); clearTimeout(S.hintT); S.runId++; };
buildMenus();
buildPlayers();
if(GAMES[PAGE] && GAMES[PAGE].direct && player) startGame(PAGE, GAMES[PAGE].levels[0].k);   // anatomie : un seul niveau, on joue tout de suite
if(PAGE === 'home' && player && HASH === '#menu') enterHome();   // retour d'un jeu : on garde le joueur
// Appli installable (PWA) : le service worker met les pages en cache pour jouer hors ligne. Seulement en http(s) : en double-clic (file://) on s'en passe.
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
