  <!-- JOUEURS : on choisit qui joue, ou on ajoute un joueur -->
  <section id="players" class="screen active">
    <div class="menu-in">
      <h1 class="logo"><span class="globe">🎮</span><span class="g">Les Jeux des Explorateurs</span></h1>
      <p class="tagline" id="plTagline">Qui joue ?</p>
      <div class="zones" id="plist"></div>
      <div class="card newplayer">
        <div class="namefield">
          <input id="newName" maxlength="14" placeholder="Nouveau joueur : ton prénom" autocomplete="off">
          <button class="btn" id="btnAddPlayer">➕ Ajouter</button>
        </div>
      </div>
      <div class="menu-foot"><button class="chip themeBtn" title="Changer de thème"></button><button class="chip muteBtn" title="Son"></button></div>
    </div>
  </section>
